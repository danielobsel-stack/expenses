<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Expenses</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="app">
        <header class="hero">
            <p class="eyebrow">PERSONAL FINANCE</p>
            <h1>My Expenses</h1>
            <p class="subtitle">Track your spending quickly and simply.</p>
        </header>

        <section class="card">
            <form id="expense-form">
                <label for="item-name">What did you buy?</label>
                <input
                    type="text"
                    id="item-name"
                    placeholder="Name of item"
                    maxlength="100"
                    required
                >

                <label for="item-cost">How much did it cost?</label>
                <input
                    type="number"
                    id="item-cost"
                    placeholder="0.00"
                    min="0.01"
                    step="0.01"
                    inputmode="decimal"
                    required
                >

                <button type="submit">Add expense</button>
            </form>
        </section>

        <section class="card summary-card">
            <div class="summary">
                <div>
                    <p class="summary-label">Total expenses</p>
                    <h2 id="total-expenses">$0.00</h2>
                </div>
                <button id="clear-all" class="secondary-button" type="button">Clear all</button>
            </div>

            <div id="expenses" aria-live="polite"></div>
            <p id="empty-state" class="empty-state">No expenses yet. Add your first expense above.</p>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
